# =========================================================================
# CAPSTONE FSE: Core Retail Ledger & Balance Mutation Engine
# Account Service Configuration & HikariCP Pool Isolation
# =========================================================================

spring.application.name=account-service
server.port=8081

# =========================================================================
# ORACLE XE 21c DATASOURCE CONFIGURATION
# =========================================================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=fse_user
spring.datasource.password=fse_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dedicated HikariCP Pool for Account & User Onboarding Service
spring.datasource.hikari.pool-name=HikariPool-AccountService
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# =========================================================================
# REDIS CACHE (Token Rotation & User Cache)
# =========================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================================================================
# JPA & HIBERNATE SETTINGS
# =========================================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ==============================================================================
# Actuator & Observability
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ==============================================================================
# OpenTelemetry Distributed Tracing Configuration
# ==============================================================================
# 100% of API requests are traced
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:1.0}

# Standard W3C Trace Context propagation (traceparent / tracestate)
management.tracing.propagation.type=W3C

# Baggage correlation in MDC
management.tracing.baggage.correlation.enabled=true

# OTLP HTTP trace exporter endpoint (Jaeger or OpenTelemetry Collector)
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http

# Logging pattern with MDC correlation: service-name, traceId, spanId
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.com.bank.ledger=INFO
logging.level.com.fse.banking=INFO
logging.level.com.zaxxer.hikari=DEBUG

# ==============================================================================
# REDIS DISTRIBUTED CACHE & SESSION STORE
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms

# ==============================================================================
# JWT & SECURITY CONFIGURATION
# ==============================================================================
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZnNlLWNhcHN0b25lLWJhbmtpbmctcGxhdGZvcm0tMjAyNi0xMjM0NTY3ODkwMTI=}
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800
jwt.issuer=fse-banking-account-service
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=Strict
jwt.cookie.path=/api/v1/auth

app.services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8083}

