spring.application.name=account-service-test
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=c3VwZXItc2VjcmV0LWtleS1mb3ItZnNlLWNhcHN0b25lLWJhbmtpbmctcGxhdGZvcm0tMjAyNi0xMjM0NTY3ODkwMTI=
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800
jwt.issuer=fse-banking-account-service
jwt.cookie.secure=false
jwt.cookie.same-site=Strict
jwt.cookie.path=/api/v1/auth

# Tracing test properties
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
management.health.redis.enabled=false
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
management.tracing.baggage.correlation.enabled=true
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
