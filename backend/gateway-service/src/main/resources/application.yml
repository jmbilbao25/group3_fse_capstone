server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/accounts/**, /api/v1/accounts/**, /api/v1/auth/**, /api/v1/kyc/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-mutation-engine
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/transactions/**, /api/v1/transactions/**, /api/v1/ledger/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-transfers
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - RewritePath=/api/v1/transfers(?<segment>/?.*), /api/v1/ledger/transfers$1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**, /api/v1/notifications/**, /ws/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: mailhog-api
          uri: ${MAILHOG_API_URI:http://mailhog:8025}
          predicates:
            - Path=/api/v2/messages, /api/v2/messages/**

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZnNlLWNhcHN0b25lLWJhbmtpbmctcGxhdGZvcm0tMjAyNi0xMjM0NTY3ODkwMTI=}
  issuer: ${JWT_ISSUER:fse-banking-account-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}