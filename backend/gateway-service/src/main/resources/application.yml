server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/accounts/**, /api/v1/accounts/**, /api/v1/auth/**, /api/v1/kyc/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-mutation-engine
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/transactions/**, /api/v1/transactions/**, /api/v1/ledger/**, /api/v1/t24/**, /api/t24/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Console maker-checker queue lives on the ledger controller, not the transfer orchestrator.
        - id: ledger-transfer-reviews
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers/pending, /api/v1/transfers/*/approve, /api/v1/transfers/*/reject
          filters:
            - RewritePath=/api/v1/transfers(?<segment>/?.*), /api/v1/ledger/transfers$1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-transfers
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers, /api/v1/transfers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-reversals
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/reversals, /api/v1/reversals/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: ledger-users
          uri: ${LEDGER_ENGINE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users(?<segment>/?.*), /api/v1/ledger/users$1

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**, /api/v1/notifications/**, /ws/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: mailhog-api
          uri: ${MAILHOG_API_URI:http://mailhog:8025}
          predicates:
            - Path=/api/v2/messages, /api/v2/messages/**

        - id: risk-service
          uri: ${RISK_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/risk/**, /risk/**, /api/v1/analyst/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZnNlLWNhcHN0b25lLWJhbmtpbmctcGxhdGZvcm0tMjAyNi0xMjM0NTY3ODkwMTI=}
  issuer: ${JWT_ISSUER:fse-banking-account-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}