# =========================================================================
# CAPSTONE FSE: Core Retail Ledger & Balance Mutation Engine
# Cloud Native Production Profile: Microsoft Azure (Azure SQL + Azure Postgres)
# =========================================================================

spring.application.name=ledger-mutation-engine
server.port=8082

# =========================================================================
# 1. PRIMARY DATASOURCE: AZURE SQL DATABASE (Master Relational State)
# =========================================================================
spring.datasource.master.url=${AZURE_SQL_URL:jdbc:sqlserver://sql-banking-master.database.windows.net:1433;databaseName=sqldb-master;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.master.username=${AZURE_SQL_USERNAME:fse_admin}
spring.datasource.master.password=${AZURE_SQL_PASSWORD}
spring.datasource.master.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Pool Configuration for Azure SQL
spring.datasource.master.hikari.pool-name=HikariPool-AzureSqlMaster
spring.datasource.master.hikari.maximum-pool-size=30
spring.datasource.master.hikari.minimum-idle=5
spring.datasource.master.hikari.connection-timeout=20000
spring.datasource.master.hikari.idle-timeout=300000
spring.datasource.master.hikari.max-lifetime=1200000
spring.datasource.master.hikari.auto-commit=false

# =========================================================================
# 2. SECONDARY DATASOURCE: AZURE DATABASE FOR POSTGRESQL (Audit Vault)
# =========================================================================
spring.datasource.postgres.url=${AZURE_POSTGRES_URL:jdbc:postgresql://psql-banking-audit.postgres.database.azure.com:5432/banking_audit?sslmode=require}
spring.datasource.postgres.username=${AZURE_POSTGRES_USERNAME:audit_admin}
spring.datasource.postgres.password=${AZURE_POSTGRES_PASSWORD}
spring.datasource.postgres.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration for Azure PostgreSQL
spring.datasource.postgres.hikari.pool-name=HikariPool-AzurePostgresAudit
spring.datasource.postgres.hikari.maximum-pool-size=30
spring.datasource.postgres.hikari.minimum-idle=5
spring.datasource.postgres.hikari.connection-timeout=20000
spring.datasource.postgres.hikari.idle-timeout=300000
spring.datasource.postgres.hikari.max-lifetime=1200000
spring.datasource.postgres.hikari.auto-commit=false

# =========================================================================
# 3. AZURE CACHE FOR REDIS (Standard Tier TLS port 6380)
# =========================================================================
spring.data.redis.host=${AZURE_REDIS_HOST:redis-banking-prod.redis.cache.windows.net}
spring.data.redis.port=${AZURE_REDIS_PORT:6380}
spring.data.redis.ssl.enabled=true
spring.data.redis.password=${AZURE_REDIS_KEY}
spring.data.redis.timeout=3000

# =========================================================================
# 4. JPA & HIBERNATE SETTINGS
# =========================================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false

# =========================================================================
# 5. AZURE EVENT HUBS (Kafka Protocol Head on Port 9093)
# =========================================================================
spring.kafka.bootstrap-servers=${AZURE_EVENT_HUBS_BOOTSTRAP:evh-banking-prod.servicebus.windows.net:9093}
spring.kafka.consumer.group-id=ledger-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENT_HUBS_CONNECTION_STRING}";

# Banking-Grade Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bank.ledger.*

# Core Banking Topics
app.kafka.topics.transaction-events=transaction-events
app.kafka.topics.notification-alerts=notification-alerts
app.kafka.topics.audit-events=audit-events
app.kafka.topics.transfers-events=banking.transfers.events

# Risk Engine Endpoint (AKS Internal DNS)
app.risk-service.url=${RISK_SERVICE_URL:http://risk-service.banking.svc.cluster.local:8084}

# Maker-Checker Threshold (BSP MORB)
app.maker-checker.threshold=50000.0000
