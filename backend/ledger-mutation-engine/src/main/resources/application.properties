# =========================================================================
# CAPSTONE FSE: Core Retail Ledger & Balance Mutation Engine
# Day 32: HikariCP Thread Pool Isolation & Multi-Datasource Configuration
# =========================================================================

spring.application.name=ledger-mutation-engine
server.port=8082

# =========================================================================
# 1. PRIMARY DATASOURCE: ORACLE XE 21c (Master State & Concurrency Locking)
# =========================================================================
spring.datasource.oracle.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.oracle.jdbc-url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.oracle.username=fse_user
spring.datasource.oracle.password=fse_password
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Pool Isolation for Oracle XE
spring.datasource.oracle.hikari.pool-name=HikariPool-OracleMaster
spring.datasource.oracle.hikari.maximum-pool-size=30
spring.datasource.oracle.hikari.minimum-idle=5
spring.datasource.oracle.hikari.connection-timeout=20000
spring.datasource.oracle.hikari.idle-timeout=300000
spring.datasource.oracle.hikari.max-lifetime=1200000
spring.datasource.oracle.hikari.auto-commit=false

# =========================================================================
# 2. SECONDARY DATASOURCE: POSTGRESQL 15+ (Immutable Audit Trail)
# =========================================================================
spring.datasource.postgres.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/banking_audit
spring.datasource.postgres.jdbc-url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/banking_audit
spring.datasource.postgres.username=audit_user
spring.datasource.postgres.password=audit_password
spring.datasource.postgres.driver-class-name=org.postgresql.Driver

# HikariCP Pool Isolation for PostgreSQL
spring.datasource.postgres.hikari.pool-name=HikariPool-PostgresAudit
spring.datasource.postgres.hikari.maximum-pool-size=30
spring.datasource.postgres.hikari.minimum-idle=5
spring.datasource.postgres.hikari.connection-timeout=20000
spring.datasource.postgres.hikari.idle-timeout=300000
spring.datasource.postgres.hikari.max-lifetime=1200000
spring.datasource.postgres.hikari.auto-commit=false

# =========================================================================
# 3. REDIS DISTRIBUTED CACHE (Token Rotation & Idempotency)
# =========================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# =========================================================================
# 4. JPA & HIBERNATE SETTINGS
# =========================================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ==============================================================================
# Actuator Observability & Prometheus Metrics
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ==============================================================================
# OpenTelemetry Distributed Tracing Configuration
# ==============================================================================
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:1.0}
management.tracing.propagation.type=W3C
management.tracing.baggage.correlation.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =========================================================================
# 5. LOGGING LEVELS
# =========================================================================
logging.level.com.bank.ledger=INFO
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=WARN
# ==============================================================================
# 6. APACHE KAFKA CONFIGURATION (KRaft Event Streaming)
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ledger-notification-group
spring.kafka.consumer.auto-offset-reset=earliest

# Banking-Grade Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# JSON Serialization for Cross-Service Interoperability
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bank.ledger.*

# Core Banking Topics
app.kafka.topics.transaction-events=transaction-events
app.kafka.topics.notification-alerts=notification-alerts
app.kafka.topics.audit-events=audit-events
app.kafka.topics.transfers-events=banking.transfers.events

# =========================================================================
# 7. MAKER-CHECKER DUAL CONTROL CONFIGURATION (BSP Regulations)
# =========================================================================
# Transfers above this threshold require Teller approval with soft hold
app.maker-checker.threshold=50000.0000

