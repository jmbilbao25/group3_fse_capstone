# =========================================================================
# CAPSTONE FSE: Notification & Alert Service
# Cloud Native Production Profile: Microsoft Azure (Azure SQL + Azure Event Hubs + Azure Redis)
# =========================================================================

spring.application.name=notification-service
server.port=8083

# =========================================================================
# 1. AZURE COMMUNICATION SERVICES / SENDGRID (Transactional Email Dispatch)
# =========================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.azurecomm.net}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:DoNotReply@banking-prod.azurecomm.net}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notifications.compliance-email=compliance-officer@banking-prod.azurecomm.net

# =========================================================================
# 2. AZURE EVENT HUBS CONSUMER (Kafka Protocol on Port 9093)
# =========================================================================
spring.kafka.bootstrap-servers=${AZURE_EVENT_HUBS_BOOTSTRAP:evh-banking-prod.servicebus.windows.net:9093}
spring.kafka.consumer.group-id=notification-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENT_HUBS_CONNECTION_STRING}";
app.kafka.topics.transfers-events=banking.transfers.events

# =========================================================================
# 3. AZURE CACHE FOR REDIS (Seen Deduplication Cache)
# =========================================================================
spring.data.redis.host=${AZURE_REDIS_HOST:redis-banking-prod.redis.cache.windows.net}
spring.data.redis.port=${AZURE_REDIS_PORT:6380}
spring.data.redis.ssl.enabled=true
spring.data.redis.password=${AZURE_REDIS_KEY}
spring.data.redis.timeout=2000

# =========================================================================
# 4. AZURE SQL DATABASE (Notifications Log Table)
# =========================================================================
spring.datasource.url=${AZURE_SQL_URL:jdbc:sqlserver://sql-banking-master.database.windows.net:1433;databaseName=sqldb-master;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${AZURE_SQL_USERNAME:fse_admin}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
