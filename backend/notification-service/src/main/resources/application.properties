# =========================================================================
# CAPSTONE FSE: Core Retail Ledger & Balance Mutation Engine
# Notification & Alert Microservice (notification-service :8083)
# =========================================================================

spring.application.name=notification-service
server.port=8083

# =========================================================================
# 1. MAIL CONFIGURATION (Default: MailHog SMTP localhost:1025 or Live SMTP)
# =========================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@corebank.ph}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notifications.compliance-email=compliance-officer@corebank.ph

# =========================================================================
# 2. APACHE KAFKA EVENT BUS CONSUMER
# =========================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-workers
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topics.transfers-events=banking.transfers.events

# =========================================================================
# 3. REDIS DISTRIBUTED CACHE (Seen Cache Deduplication)
# =========================================================================
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=2000

# =========================================================================
# 4. ORACLE XE 21c MASTER PERSISTENCE (Notifications Table)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SYSTEM}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password123#}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# =========================================================================
# 5. OBSERVABILITY & PROMETHEUS METRICS (:8083/actuator/prometheus)
# =========================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always

# =========================================================================
# 6. LOGGING (Silence noisy Kafka broker reconnect warnings during local dev)
# =========================================================================
logging.level.org.apache.kafka=ERROR
logging.level.org.apache.kafka.clients.NetworkClient=OFF
