<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Square field, matching the zero-radius shape lock. -->
  <rect width="32" height="32" fill="#3A4CD6"/>
  <!-- Three ledger rules of decreasing length: the debit/credit/balance triplet
       that every statement row reduces to. Reads as a mark at 16px. -->
  <rect x="7" y="9"  width="18" height="3" fill="#FFFFFF"/>
  <rect x="7" y="15" width="13" height="3" fill="#FFFFFF" opacity="0.72"/>
  <rect x="7" y="21" width="8"  height="3" fill="#FFFFFF" opacity="0.48"/>
</svg>
