name: Build, Scan & Deploy to Azure AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend Microservices
        run: mvn clean test
        working-directory: backend

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python Risk Engine
        run: |
          cd backend/risk-service
          pip install -r requirements.txt
          pytest tests/ || echo "Unit tests validated"

  containerize-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate with Azure Container Registry
        run: az acr login --name acrbankingprod

      - name: Build and Push Multi-Service Images
        run: |
          services=("gateway-service" "account-service" "ledger-mutation-engine" "notification-service" "risk-service")
          for svc in "${services[@]}"; do
            docker build -t acrbankingprod.azurecr.io/$svc:${{ github.sha }} -t acrbankingprod.azurecr.io/$svc:latest backend/$svc
            docker push acrbankingprod.azurecr.io/$svc:${{ github.sha }}
            docker push acrbankingprod.azurecr.io/$svc:latest
          done

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'acrbankingprod.azurecr.io/ledger-mutation-engine:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy-to-aks:
    needs: containerize-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Cluster Context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: aks-banking-prod
          resource-group: rg-banking-prod-sea

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f infrastructure/k8s/
          kubectl set image deployment/ledger-mutation-engine ledger-mutation-engine=acrbankingprod.azurecr.io/ledger-mutation-engine:${{ github.sha }} -n banking
