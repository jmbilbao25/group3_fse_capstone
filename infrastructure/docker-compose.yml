networks:
  banking-net:
    name: banking-net
    driver: bridge

services:
  # ============================================================================
  # 1. Master Relational Database (Oracle Database Express Edition 21c)
  # Container Name: oracle-xe-master
  # Houses operational state: users, accounts, balances, transactions, outbox
  # ============================================================================
  oracle-xe-master:
    container_name: oracle-xe-master
    image: gvenzl/oracle-xe:latest
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=Password123#
      - APP_USER=fse_user
      - APP_USER_PASSWORD=fse_password
    volumes:
      - ./oracle/init.sql:/container-entrypoint-initdb.d/init.sql:ro
      - oracle_data:/opt/oracle/oradata
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ============================================================================
  # 2. Dedicated Immutable Audit Vault (PostgreSQL 16)
  # Container Name: postgres-audit-vault
  # Houses append-only mutation journal protected by compliance triggers
  # ============================================================================
  postgres-audit-vault:
    container_name: postgres-audit-vault
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=banking_audit
      - POSTGRES_USER=audit_user
      - POSTGRES_PASSWORD=audit_password
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d banking_audit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ============================================================================
  # 3. Distributed In-Memory Cache (Redis 7)
  # Container Name: redis-cache
  # Houses token blacklist, session families, and idempotency locks
  # ============================================================================
  redis-cache:
    container_name: redis-cache
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    labels:
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host": "%%host%%", "port": "6379"}]'
      com.datadoghq.ad.logs: '[{"source": "redis", "service": "redis-cache"}]'
    networks:
      - banking-net

        # ============================================================================
  # 4. Event Bus: Apache Kafka (KRaft Mode - No ZooKeeper)
  # Container Name: kafka-broker
  # High-throughput asynchronous event streaming for mutations & alerts
  # ============================================================================
  kafka-broker:
    container_name: kafka-broker
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9999:9999"
    environment:
      # KRaft cluster configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L622nShTUiBenYhRZTyMP'
      JMX_PORT: 9999
      KAFKA_JMX_OPTS: '-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-broker'
    labels:
      com.datadoghq.ad.check_names: '["kafka_consumer"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"kafka_connect_str": "kafka-broker:29092", "monitor_unlisted_consumer_groups": true}]'
      com.datadoghq.ad.logs: '[{"source": "kafka", "service": "kafka-broker"}]'
    networks:
      - banking-net

  # ============================================================================
  # 5. Kafka Web UI Dashboard
  # Container Name: kafka-ui
  # Real-time message, topic, and consumer inspection on port 8085
  # ============================================================================
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'banking-kafka-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-broker:29092'
    networks:
      - banking-net
    depends_on:
      - kafka-broker

  # ============================================================================
  # 6. Database Web Console (Adminer with Oracle OCI8 & PostgreSQL)
  # Container Name: db-adminer
  # Web management GUI for database inspection and queries
  # ============================================================================
  adminer:
    container_name: db-adminer
    build:
      context: ./adminer
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - banking-net
    depends_on:
      - postgres-audit-vault
      - oracle-xe-master

  # ============================================================================
  # 7. Local Mock SMTP Server & Email Web Inbox (MailHog)
  # Container Name: mailhog-smtp
  # Catches all transaction receipt, 2FA OTP, and admin alert emails with live Web UI
  # ============================================================================
  mailhog:
    container_name: mailhog-smtp
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web Inbox UI
    networks:
      - banking-net

  # ============================================================================
  # 7b. Redis Insight Web Management GUI
  # Container Name: redis-insight
  # Visual dashboard for inspecting Redis keys, memory usage, and TTLs
  # ============================================================================
  redis-insight:
    container_name: redis-insight
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540" # Web UI
    volumes:
      - redisinsight_data:/data
    networks:
      - banking-net
    depends_on:
      - redis-cache

  # ============================================================================
  # 8. Account & Identity Service (Spring Boot :8081)
  # Container Name: account-service
  # User registration, authentication, KYC profiles, and account provisioning
  # ============================================================================
  account-service:
    container_name: account-service
    build:
      context: ../backend/account-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./datadog/dd-java-agent.jar:/app/dd-java-agent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/dd-java-agent.jar
      - DD_AGENT_HOST=dd-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=account-service
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1.0
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-xe-master:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=fse_user
      - SPRING_DATASOURCE_PASSWORD=fse_password
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "account-service"}]'
    networks:
      - banking-net
    depends_on:
      - oracle-xe-master
      - redis-cache
      - dd-agent

  # ============================================================================
  # 9. Core Ledger & Balance Mutation Engine (Spring Boot :8082)
  # Container Name: ledger-mutation-engine
  # High-throughput balance mutations, pessimistic row locking & outbox events
  # ============================================================================
  ledger-mutation-engine:
    container_name: ledger-mutation-engine
    build:
      context: ../backend/ledger-mutation-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./datadog/dd-java-agent.jar:/app/dd-java-agent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/dd-java-agent.jar
      - DD_AGENT_HOST=dd-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=ledger-mutation-engine
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1.0
      - SPRING_DATASOURCE_ORACLE_URL=jdbc:oracle:thin:@oracle-xe-master:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_JDBC_URL=jdbc:oracle:thin:@oracle-xe-master:1521/XEPDB1
      - SPRING_DATASOURCE_ORACLE_USERNAME=fse_user
      - SPRING_DATASOURCE_ORACLE_PASSWORD=fse_password
      - SPRING_DATASOURCE_POSTGRES_URL=jdbc:postgresql://postgres-audit-vault:5432/banking_audit
      - SPRING_DATASOURCE_POSTGRES_JDBC_URL=jdbc:postgresql://postgres-audit-vault:5432/banking_audit
      - SPRING_DATASOURCE_POSTGRES_USERNAME=audit_user
      - SPRING_DATASOURCE_POSTGRES_PASSWORD=audit_password
      - POSTGRES_HOST=postgres-audit-vault
      - POSTGRES_PORT=5432
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - APP_RISK_SERVICE_URL=http://risk-service:8084
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "ledger-mutation-engine"}]'
    networks:
      - banking-net
    depends_on:
      - oracle-xe-master
      - postgres-audit-vault
      - redis-cache
      - kafka-broker
      - risk-service
      - dd-agent

  # ============================================================================
  # 9b. Local NanoJev Risk Engine (FastAPI / Threaded Python :8084)
  # Container Name: risk-service
  # Real-time System 1 transfer risk evaluation, geo-velocity & anomaly scoring
  # ============================================================================
  risk-service:
    container_name: risk-service
    build:
      context: ../backend/risk-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    volumes:
      - ../backend/risk-service/app:/app/app
      - ../backend/risk-service/data:/app/data
      - ../hybrid_bench:/app/hybrid_bench
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=risk-service
      - DD_ENV=local
      - DD_VERSION=2.0.0
      - DD_LOGS_INJECTION=true
      - SETTLEMENT_WINDOW_SECONDS=60.0
      - REVIEW_QUEUE_MAXSIZE=1000
      - REVIEW_WORKER_THREADS=2
      - ONNX_INTRA_OP_THREADS=8
      - TAU_2FA=0.40
      - TAU_BLOCK=0.50
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "risk-service"}]'
    networks:
      - banking-net
    depends_on:
      - dd-agent
    healthcheck:
      test: ["CMD", "/opt/datadog-agent/embedded/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 10. Notification & Alert Service (Spring Boot :8083)
  # Container Name: notification-service
  # Asynchronous email receipt generation, 2FA OTP dispatch & admin alerts
  # ============================================================================
  notification-service:
    container_name: notification-service
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./datadog/dd-java-agent.jar:/app/dd-java-agent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/dd-java-agent.jar
      - DD_AGENT_HOST=dd-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=notification-service
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1.0
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-xe-master:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=fse_user
      - SPRING_DATASOURCE_PASSWORD=fse_password
      - SPRING_REDIS_HOST=redis-cache
      - SPRING_REDIS_PORT=6379
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "notification-service"}]'
    networks:
      - banking-net
    depends_on:
      - oracle-xe-master
      - redis-cache
      - mailhog
      - kafka-broker
      - dd-agent

  # ============================================================================
  # 11. API Gateway Service (Spring Cloud Gateway :8080)
  # Container Name: gateway-service
  # Edge perimeter routing, JWT verification, and Redis rate limiting
  # ============================================================================
  gateway-service:
    container_name: gateway-service
    build:
      context: ../backend/gateway-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./datadog/dd-java-agent.jar:/app/dd-java-agent.jar:ro
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/dd-java-agent.jar
      - DD_AGENT_HOST=dd-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=gateway-service
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1.0
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - ACCOUNT_SERVICE_URI=http://account-service:8081
      - LEDGER_ENGINE_URI=http://ledger-mutation-engine:8082
      - NOTIFICATION_SERVICE_URI=http://notification-service:8083
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "gateway-service"}]'
    networks:
      - banking-net
    depends_on:
      - redis-cache
      - account-service
      - ledger-mutation-engine
      - notification-service
      - dd-agent

  # ============================================================================
  # 12. Core Retail Banking Single Page Application (React / Vite / Nginx :3000)
  # Container Name: banking-frontend
  # Web Portal for Customers and Administrators (Reverse-proxied via Nginx)
  # ============================================================================
  banking-frontend:
    container_name: banking-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - banking-net
    depends_on:
      - gateway-service

  # ============================================================================
  # 13. OpenTelemetry Distributed Tracing Backend & Visualizer (Jaeger All-In-One)
  # Container Name: jaeger-tracing
  # Ingests OTLP traces (HTTP :4318, gRPC :4317) and provides trace visualization (:16686)
  # ============================================================================
  jaeger-tracing:
    container_name: jaeger-tracing
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - banking-net

  # ============================================================================
  # 14. Prometheus Metrics Scraper & Time-Series Engine
  # Container Name: prometheus-engine
  # Scrapes /actuator/prometheus from services and exposes metrics on :9090
  # ============================================================================
  prometheus:
    container_name: prometheus-engine
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - banking-net

  # ============================================================================
  # 15. Grafana Metrics Visualization & Telemetry Dashboard
  # Container Name: grafana-dashboard
  # Web UI on :3001 with auto-provisioned Prometheus datasource & banking dashboards
  # ============================================================================
  grafana:
    container_name: grafana-dashboard
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger-tracing
    networks:
      - banking-net

  # ============================================================================
  # 16. Enterprise Observability & Request Tracing (Datadog Agent 7)
  # Container Name: dd-agent
  # Live metrics, APM request traces, waterfall spans, and container logs
  # ============================================================================
  dd-agent:
    container_name: dd-agent
    image: registry.datadoghq.com/agent:7
    restart: unless-stopped
    ports:
      - "8126:8126"       # APM trace receiver
      - "8125:8125/udp"   # DogStatsD metrics
    environment:
      - DD_API_KEY=38f78a4f829a542181926e4e9499146d
      - DD_SITE=datadoghq.com
      - DD_ENV=local
      - DD_TAGS=env:local
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT=0.0.0.0:4318
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT=0.0.0.0:4317
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_SKIP_SSL_VALIDATION=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - banking-net

  # ============================================================================
  # 17. Datadog Synthetics Private Location Worker
  # Container Name: datadog-synthetics-worker
  # Executes Synthetic API tests inside the internal banking-net container network
  # ============================================================================
  datadog-synthetics-worker:
    container_name: datadog-synthetics-worker
    image: registry.datadoghq.com/synthetics-private-location-worker:latest
    restart: unless-stopped
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_EXTRA_CA_CERTS=/etc/datadog/certs/ca-bundle.pem
    volumes:
      - ./datadog/synthetics-location-config.json:/etc/datadog/synthetics-check-runner.json:ro
      - ./datadog/certs:/etc/datadog/certs:ro
    networks:
      - banking-net
    depends_on:
      - gateway-service

volumes:
  oracle_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  redisinsight_data:


