apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: banking
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banking
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: banking
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.banking.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka.banking.svc.cluster.local:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: CLUSTER_ID
              value: "4L622nShTZaJvtPGBm-JyA"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: banking
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      name: plaintext
      targetPort: 9092
    - port: 9093
      name: controller
      targetPort: 9093
  selector:
    app: kafka
---
# ==============================================================================
# In-Cluster PostgreSQL Audit Vault (Cost: $0.00 / Saves ~$12/month)
# Automatically initializes immutable compliance audit schema and trigger
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-audit-init-schema
  namespace: banking
data:
  01_audit_schema.sql: |
    CREATE TABLE IF NOT EXISTS ledger_mutation_audit (
        audit_id            BIGSERIAL PRIMARY KEY,
        transaction_id      VARCHAR(64) NOT NULL UNIQUE,
        account_id          VARCHAR(36) NOT NULL,
        mutation_type       VARCHAR(16) NOT NULL,
        mutation_amount     NUMERIC(18, 4) NOT NULL,
        before_balance      NUMERIC(18, 4) NOT NULL,
        after_balance       NUMERIC(18, 4) NOT NULL,
        initiator_user_id   VARCHAR(36) NOT NULL,
        approved_by_user_id VARCHAR(36),
        status              VARCHAR(20) NOT NULL DEFAULT 'COMMITTED',
        created_at          TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT ledger_mutation_audit_mutation_amount_check CHECK (mutation_amount > 0),
        CONSTRAINT ledger_mutation_audit_after_balance_check CHECK (after_balance >= 0),
        CONSTRAINT ledger_mutation_audit_mutation_type_check CHECK (
            mutation_type IN ('TRANSFER', 'DEBIT', 'CREDIT', 'HOLD', 'RELEASE', 'REVERSAL')
        ),
        CONSTRAINT ledger_mutation_audit_status_check CHECK (
            status IN ('COMMITTED', 'FAILED', 'ROLLED_BACK')
        )
    );
    CREATE INDEX IF NOT EXISTS idx_audit_tx_id ON ledger_mutation_audit(transaction_id);
    CREATE INDEX IF NOT EXISTS idx_audit_acc_time ON ledger_mutation_audit(account_id, created_at DESC);

    CREATE OR REPLACE FUNCTION enforce_audit_immutability()
    RETURNS TRIGGER AS $$
    BEGIN
        RAISE EXCEPTION 'Compliance Violation: ledger_mutation_audit is strictly append-only. UPDATE and DELETE operations are blocked.';
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_immutable_audit ON ledger_mutation_audit;
    CREATE TRIGGER trg_immutable_audit
        BEFORE UPDATE OR DELETE
    ON ledger_mutation_audit
    FOR EACH ROW
    EXECUTE FUNCTION enforce_audit_immutability();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: banking
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: POSTGRES_DB
              value: "banking_audit"
            - name: POSTGRES_USER
              value: "audit_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-password
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01_audit_schema.sql
              subPath: 01_audit_schema.sql
      volumes:
        - name: init-sql
          configMap:
            name: postgres-audit-init-schema
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banking
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
