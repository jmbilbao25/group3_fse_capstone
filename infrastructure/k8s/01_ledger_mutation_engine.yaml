apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-mutation-engine
  namespace: banking
  labels:
    app: ledger-mutation-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-mutation-engine
  template:
    metadata:
      labels:
        app: ledger-mutation-engine
    spec:
      containers:
        - name: ledger-mutation-engine
          image: __ACR_NAME__.azurecr.io/ledger-mutation-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseSerialGC -Xms128m -Xmx320m"
            - name: SPRING_PROFILES_ACTIVE
              value: "azure"
            - name: AZURE_SQL_URL
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-url
            - name: AZURE_SQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-username
            - name: AZURE_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-password
            - name: AZURE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-url
            - name: AZURE_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-username
            - name: AZURE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-password
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.banking.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking.svc.cluster.local:9092"
            - name: RISK_SERVICE_URL
              value: "http://risk-service.banking.svc.cluster.local:8084"
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-mutation-engine
  namespace: banking
  labels:
    app: ledger-mutation-engine
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: ledger-mutation-engine
