global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:8080"
          - "gateway-service:8080"
        labels:
          application: "gateway-service"
          tier: "edge-gateway"

  - job_name: "account-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:8081"
          - "account-service:8081"
        labels:
          application: "account-service"
          tier: "core-domain"

  - job_name: "ledger-mutation-engine"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:8082"
          - "ledger-mutation-engine:8082"
        labels:
          application: "ledger-mutation-engine"
          tier: "ledger-domain"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:8083"
          - "notification-service:8083"
        labels:
          application: "notification-service"
          tier: "notification-domain"
