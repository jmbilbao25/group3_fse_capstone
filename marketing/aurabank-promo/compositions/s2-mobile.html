                      <div class="s2-tab"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M3 10h18" /></svg>Cards</div>
                      <div class="s2-tab"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3" /></svg>Transfer</div>
                      <div class="s2-tab"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" /></svg>Profile</div>
                    </div>
                    <div id="s2-notif" class="s2-notif" data-layout-allow-overlap>
                      <svg aria-hidden="true"><use href="#s2-mark" /></svg>
                      <div class="s2-nt"><b data-layout-allow-overlap>Aura<span>now</span></b><p data-layout-allow-overlap>You received ₱15,000.00 from Maria Santos</p></div>
                    </div>
                  </div>

                  <canvas id="s2-fx" width="812" height="1712" data-layout-allow-occlusion></canvas>
                  <div id="s2-glare" class="s2-glare" data-layout-allow-occlusion data-layout-allow-overflow></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const K = window.AuraKit;
          const H = K.HANDOFF;
          const S = 2.3; // host data-start: tweens below are written in root seconds
          const g = K.at(S);
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const OUT = "expo.out";

          function build() {
            // The wallet face is painted by the same routine as the 3D card's texture.
            K.paintCardCanvas($("#s2-card-canvas"), { last4: "2314", holder: "Elijah R. Montefalco", network: "visa", balance: true });

            // Face ID ticks, built once.
            const ticks = $("#s2-ticks");
            for (let i = 0; i < 36; i++) {
              const a = (i / 36) * Math.PI * 2 - Math.PI / 2;
              const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
              ln.setAttribute("x1", (60 + Math.cos(a) * 46).toFixed(2));
              ln.setAttribute("y1", (60 + Math.sin(a) * 46).toFixed(2));
              ln.setAttribute("x2", (60 + Math.cos(a) * 54).toFixed(2));
              ln.setAttribute("y2", (60 + Math.sin(a) * 54).toFixed(2));
              ln.setAttribute("stroke", "#a7e8d1");
              ln.setAttribute("stroke-width", "2.6");
              ln.setAttribute("stroke-linecap", "round");
              ln.setAttribute("class", "s2-tick");
              ln.setAttribute("opacity", "0.16");
              ticks.appendChild(ln);
            }

            /* ---------- camera: pull back out of the logo dive ---------- */
            // The dive ended inside the arch; we come out of the login sky.
            const PULL = { at: 2.46, dur: 1.0 };
            // At 5.2x the login sky fills the frame: screen point (203, 212) sits dead centre.
            tl.fromTo("#s2-rig", { scale: 5.2, x: -440, y: 1186 }, { scale: 1, x: 0, y: 0, duration: PULL.dur, ease: OUT }, g(PULL.at));
            tl.fromTo("#s2-phone", { rotationY: 0, rotationX: 0 }, { rotationY: -22, rotationX: 7, duration: PULL.dur + 0.15, ease: "power3.out" }, g(PULL.at));
            tl.fromTo("#s2-glare", { x: -120 }, { x: 150, duration: PULL.dur + 0.15, ease: "power3.out" }, g(PULL.at));
            tl.fromTo("#s2-inner", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, g(2.46));
            // Settle into the hand-off pose; the 3D card picks up from here.
            tl.to("#s2-phone", { rotationY: H.phone.rotY, rotationX: H.phone.rotX, duration: H.t - (PULL.at + PULL.dur + 0.15), ease: "sine.inOut" }, g(PULL.at + PULL.dur + 0.15));
            tl.to("#s2-glare", { x: 40, duration: H.t - (PULL.at + PULL.dur + 0.15), ease: "sine.inOut" }, g(PULL.at + PULL.dur + 0.15));
            tl.to("#s2-phone", { rotationY: -2, duration: 0.6, ease: "sine.in" }, g(H.t));

            /* ---------- copy, locked to the VO ---------- */
            tl.fromTo("#s2-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, g(2.56));
            tl.fromTo("#s2-eb-t", { opacity: 0, x: -18, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, x: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, g(2.6));
            // "Your whole bank," word by word as it is spoken (2.63-3.22).
            [2.63, 2.8, 2.98].forEach((at, i) => {
              tl.fromTo(gsap.utils.toArray(".s2-w")[i], { yPercent: 112, rotationX: -60, filter: "blur(6px)" }, { yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.8, ease: OUT }, g(at));
            });
            // "in your pocket." lands with "pocket" (3.9) and then catches the light.
            tl.set(".s2-w", { filter: "none" }, g(3.85));
            tl.fromTo("#s2-l2", { yPercent: 112 }, { yPercent: 0, duration: 0.9, ease: OUT }, g(3.66));
            tl.fromTo("#s2-l2", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 1.0, ease: "power2.inOut", immediateRender: false }, g(4.02));

            // Each pill arrives as the phone demonstrates it.
            const pill = (sel, at) => {
              tl.fromTo(sel, { opacity: 0, y: 18, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, g(at));
              tl.fromTo(`${sel} path`, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, g(at + 0.08));
            };
            [["#s2-p1", 3.36], ["#s2-p2", 4.14], ["#s2-p3", 4.72]].forEach(([sel, at]) => pill(sel, at));

            /* ---------- the login sky keeps moving ---------- */
            tl.fromTo("#s2-lb1", { x: -20, y: 10 }, { x: 34, y: -12, duration: 1.8, ease: "sine.inOut" }, g(2.3));
            tl.fromTo("#s2-lb2", { x: 18, y: -8 }, { x: -30, y: 14, duration: 1.8, ease: "sine.inOut" }, g(2.3));
            tl.fromTo("#s2-lb3", { x: 0, scale: 0.92 }, { x: 26, scale: 1.08, duration: 1.8, ease: "sine.inOut" }, g(2.3));

            /* ---------- sign in with Face ID ---------- */
            tl.to("#s2-signin", { keyframes: [{ scale: 0.95, duration: 0.08, ease: "power1.out" }, { scale: 1, duration: 0.24, ease: "back.out(2)" }] }, g(3.18));
            tl.fromTo("#s2-faceid", { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, g(3.24));
            tl.fromTo(".s2-fp", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, g(3.28));
            // The scan sweeps the ring, one tick at a time.
            tl.fromTo(".s2-tick", { opacity: 0.16 }, { opacity: 1, duration: 0.12, ease: "power1.out", stagger: 0.009 }, g(3.3));
            tl.to(".s2-tick", { opacity: 0, duration: 0.18, ease: "power1.in" }, g(3.66));
            tl.fromTo("#s2-ring", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, g(3.62));
            tl.to("#s2-face", { opacity: 0, scale: 1.3, svgOrigin: "60 60", duration: 0.16, ease: "power2.in" }, g(3.6));
            tl.fromTo("#s2-check", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, g(3.66));
            tl.to("#s2-faceid", { scale: 1.06, duration: 0.12, ease: "power2.out" }, g(3.72));
            tl.to("#s2-faceid", { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, g(3.86));

            /* ---------- into the wallet ---------- */
            tl.to("#s2-sheet", { y: 420, duration: 0.3, ease: "power3.in" }, g(3.86));
            tl.to(["#s2-sky", "#s2-hello"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, g(3.9));
            tl.fromTo("#s2-dash", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, g(3.98));
            tl.to("#s2-login", { opacity: 0, duration: 0.08, ease: "none" }, g(4.04));
            ["#s2-dhead", "#s2-card", "#s2-actions", "#s2-sec", "#s2-list"].forEach((s, i) => {
              tl.fromTo(s, { y: 46 }, { y: 0, duration: 0.6, ease: OUT }, g(4.0 + i * 0.04));
            });

            /* ---------- money arrives ---------- */
            tl.fromTo("#s2-notif", { y: -140, scale: 0.96 }, { y: 0, scale: 1, duration: 0.55, ease: "back.out(1.25)" }, g(4.1));
            tl.to("#s2-notif", { y: -140, duration: 0.34, ease: "power2.in" }, g(4.9));
            // The odometer rolls only forward, and never past the true balance.
            tl.fromTo("#s2-c1", { yPercent: -60 }, { yPercent: -70, duration: 0.34, ease: "power3.out" }, g(4.46));
            tl.fromTo("#s2-c2", { yPercent: -10 }, { yPercent: -60, duration: 0.38, ease: "power3.out" }, g(4.42));
            tl.fromTo("#s2-shine", { xPercent: -160 }, { xPercent: 330, duration: 0.7, ease: "power2.inOut" }, g(4.46));
            tl.fromTo("#s2-r1", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: OUT }, g(4.5));
            // Old rows sit in the top slot until the new one lands, then make room.
            tl.fromTo("#s2-rest", { y: -78 }, { y: 0, duration: 0.6, ease: OUT }, g(4.46));
            tl.fromTo("#s2-r1hl", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, g(4.5));
            tl.to("#s2-r1hl", { opacity: 0, duration: 0.6, ease: "power1.inOut" }, g(5.0));

            // Sparks burst from the balance on the beat (4.5), in screen space.
            const fx = $("#s2-fx").getContext("2d");
            const r = K.rng(4500);
            const SPARKS = Array.from({ length: 34 }, () => {
              const a = r() * Math.PI * 2;
              return { a, v: 90 + r() * 170, life: 0.4 + r() * 0.45, size: 1.2 + r() * 2.2, delay: r() * 0.08 };
            });
            const BX = 18 + 130;
            const BY = 120 + 73;
            const fxCanvas = $("#s2-fx");
            K.clock(tl, 3.45, (lt) => {
              const t = lt + S;
              fxCanvas.style.visibility = t < 4.48 || t > 5.4 ? "hidden" : "visible";
              fx.clearRect(0, 0, 812, 1712);
              if (t < 4.48 || t > 5.4) return;
              fx.globalCompositeOperation = "lighter";
              const ring = K.clamp((t - 4.5) / 0.55);
              if (ring > 0 && ring < 1) {
                const e = K.ease("power2.out")(ring);
                Object.assign(fx, { strokeStyle: `rgba(167,232,209,${0.6 * (1 - ring)})`, lineWidth: 2 * (3 - 2 * ring) });
                fx.beginPath();
                fx.ellipse(BX * 2, BY * 2, (40 + 220 * e) * 2, (16 + 90 * e) * 2, 0, 0, Math.PI * 2);
                fx.stroke();
              }
              for (const s of SPARKS) {
                const age = t - 4.5 - s.delay;
                if (age < 0 || age > s.life) continue;
                const k = age / s.life;
                const d = s.v * (1 - Math.pow(1 - k, 3)) * s.life * 0.9;
                const x = (BX + Math.cos(s.a) * d * 1.6) * 2;
                const y = (BY + Math.sin(s.a) * d * 0.7 + 40 * age * age) * 2;
                const rad = s.size * 2 * (1 - 0.6 * k);
                const gr = fx.createRadialGradient(x, y, 0, x, y, rad * 3.5);
                gr.addColorStop(0, `rgba(245,255,251,${(1 - k) * 0.95})`);
                gr.addColorStop(0.35, `rgba(167,232,209,${(1 - k) * 0.6})`);
                gr.addColorStop(1, "rgba(151,207,243,0)");
                fx.fillStyle = gr;
                fx.fillRect(x - rad * 3.5, y - rad * 3.5, rad * 7, rad * 7);
              }
            });

            /* ---------- the card leaves the phone (card3d takes it from here) ---------- */
            tl.to("#s2-card-face", { opacity: 0, duration: 0.05, ease: "none" }, g(H.t));
            tl.fromTo("#s2-slot", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, g(H.t));
            // Focus racks to the card: the phone and copy fall back.
            tl.fromTo("#s2-rig", { filter: "blur(0px)" }, { filter: "blur(7px)", opacity: 0.72, duration: 0.42, ease: "power2.out", immediateRender: false }, g(H.t + 0.04));
            tl.fromTo("#s2-copy", { filter: "blur(0px)" }, { filter: "blur(5px)", opacity: 0.6, duration: 0.42, ease: "power2.out", immediateRender: false }, g(H.t + 0.04));

            /* ---------- whip pan to the web ---------- */
            tl.set("#s2-inner", { filter: "url(#s2-whip)" }, g(5.3));
            tl.fromTo("#s2-whip-b", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "46 0" }, duration: 0.26, ease: "power2.in" }, g(5.3));
            tl.to("#s2-inner", { x: -520, duration: 0.3, ease: "power3.in" }, g(5.3));
            tl.to("#s2-inner", { opacity: 0, duration: 0.12, ease: "power1.in" }, g(5.46));

            window.__timelines["s2"] = tl;
          }

          K.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
