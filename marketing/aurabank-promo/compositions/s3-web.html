        .s3-cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; z-index: 10; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .45)); }

            <symbol id="s3-mark" viewBox="0 0 64 64">

              <path d="M18 48C18 29 24.5 15 32 15C39.5 15 46 29 46 48" fill="none" stroke="url(#s3-arch-g)" stroke-width="6.4" stroke-linecap="round" />
              <path d="M22.5 37C26.5 33 29.5 33 32 35.5C34.5 38 37.5 38 41.5 34" fill="none" stroke="#fff" stroke-opacity=".94" stroke-width="3.6" stroke-linecap="round" />
            </symbol>

        <div id="s3-inner" class="s3-inner">
          <div id="s3-copy" class="s3-copy">
            <div id="s3-eyebrow" class="eyebrow"><i id="s3-dot"></i><span id="s3-eb-t">Aura Web</span></div>

              <span class="ln"><span class="w s3-w">Transfers</span> <span class="w s3-w">that</span></span>
              <span class="ln"><span id="s3-l2" class="w grad">land in seconds.</span></span>
            </h2>
            <div class="pills">
              <div id="s3-p1" class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" /></svg>Any browser, no install</div>
              <div id="s3-p2" class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" /><path d="M9 12l2 2 4-4" /></svg>Every transfer screened</div>
            </div>

          <div id="s3-rig" class="s3-rig">
            <div id="s3-browser" class="s3-browser">
              <div class="s3-chrome">
                <div class="d"></div><div class="d"></div><div class="d"></div>
                <div class="s3-url"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>aurabank.ph</div>

                    <div id="s3-send-b" class="s3-send-lbl s3-send-b" style="opacity: 0"><svg class="ic" viewBox="0 0 24 24"><path id="s3-chk" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.4" /></svg>Sent · landed in 1.8 s</div>

      <script>
        (function () {
          const K = window.AuraKit;
          const S = 5.3;
          const g = K.at(S);
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const OUT = "expo.out";

          function build() {
            K.paintCardCanvas($("#s3-c1-canvas"), { last4: "2314", holder: "Elijah R. Montefalco", network: "visa", balance: K.peso(76302.5) });
            K.paintCardCanvas($("#s3-c2-canvas"), { last4: "3417", holder: "Elijah R. Montefalco", network: "mastercard", balance: K.peso(34240.31), colourway: "peri" });

            /* ---------- whip in from the right, the card's motion carried on ---------- */
            tl.set("#s3-inner", { filter: "url(#s3-whip)" }, 0);
            tl.fromTo("#s3-whip-b", { attr: { stdDeviation: "40 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.42, ease: "power2.out" }, g(5.34));
            tl.set("#s3-inner", { filter: "none" }, g(5.78));
            tl.fromTo("#s3-inner", { x: 620, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: OUT }, g(5.34));
            tl.fromTo("#s3-browser", { rotationY: -34, rotationX: 8 }, { rotationY: -12, rotationX: 3, duration: 1.2, ease: OUT }, g(5.34));
            tl.to("#s3-browser", { rotationY: -5, rotationX: 1, duration: 2.0, ease: "sine.inOut" }, g(6.54));

            /* ---------- copy on the VO: "On the web" 5.53, "transfers" 6.51, "land in seconds" 6.91 ---------- */
            tl.fromTo("#s3-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, g(5.5));
            tl.fromTo("#s3-eb-t", { opacity: 0, x: -18, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, x: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, g(5.54));
            [6.42, 6.64].forEach((at, i) => {
              tl.fromTo(gsap.utils.toArray(".s3-w")[i], { yPercent: 112, rotationX: -60, filter: "blur(6px)" }, { yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.8, ease: OUT }, g(at));
            });
            tl.set(".s3-w", { filter: "none" }, g(7.5));
            tl.fromTo("#s3-l2", { yPercent: 112 }, { yPercent: 0, duration: 0.9, ease: OUT }, g(6.9));
            tl.fromTo("#s3-l2", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 1.0, ease: "power2.inOut", immediateRender: false }, g(7.3));
            ["#s3-p1", "#s3-p2"].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 18, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, g(5.9 + i * 1.3)));

            /* ---------- the page lives: light drifts, cards float on their own phases ---------- */
            tl.fromTo("#s3-a1", { x: -30 }, { x: 40, duration: 3.4, ease: "sine.inOut" }, 0);
            tl.fromTo("#s3-a2", { x: 30, y: 10 }, { x: -40, y: -14, duration: 3.4, ease: "sine.inOut" }, 0);
            tl.fromTo("#s3-hero", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: OUT }, g(5.56));
            tl.fromTo("#s3-c2", { opacity: 0, y: 90, rotation: 6 }, { opacity: 1, y: 0, rotation: 0, duration: 1.0, ease: OUT }, g(5.6));
            tl.fromTo("#s3-c1", { opacity: 0, y: 110, rotation: 9 }, { opacity: 1, y: 0, rotation: 0, duration: 1.0, ease: OUT }, g(5.66));
            tl.to("#s3-c2", { y: -12, duration: 2.4, ease: "sine.inOut" }, g(6.6));
            tl.to("#s3-c1", { y: 9, rotation: -1.5, duration: 2.4, ease: "sine.inOut" }, g(6.66));

            /* ---------- the cursor travels in arcs, not straight lines ---------- */
            const cursor = $("#s3-cursor");
            const legs = [
              { at: 5.92, dur: 0.55, ease: "power2.inOut", p: [[760, 470], [600, 520], [260, 470], [118, 384]] },
              { at: 6.95, dur: 0.5, ease: "power2.inOut", p: [[118, 384], [210, 300], [380, 360], [436, 425]] },
              { at: 7.9, dur: 0.42, ease: "power2.in", p: [[436, 425], [470, 450], [560, 520], [640, 600]] },
            ];
            const cursorAt = (t) => {
              let leg = legs[0];
              for (const l of legs) if (t >= l.at) leg = l;
              const u = K.ease(leg.ease)(K.clamp((t - leg.at) / leg.dur));
              return [K.bez(leg.p[0][0], leg.p[1][0], leg.p[2][0], leg.p[3][0], u), K.bez(leg.p[0][1], leg.p[1][1], leg.p[2][1], leg.p[3][1], u)];
            };
            K.clock(tl, 3.45, (lt) => {
              const [x, y] = cursorAt(lt + S);
              gsap.set(cursor, { x, y });
            });
            tl.fromTo("#s3-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, g(5.92));
            tl.to("#s3-cursor", { opacity: 0, duration: 0.3, ease: "power1.in" }, g(8.0));
            const click = (at, sel, x, y) => {
              tl.to(sel, { scale: 0.95, duration: 0.08, ease: "power1.out" }, g(at));
              tl.to(sel, { scale: 1, duration: 0.24, ease: "back.out(2)" }, g(at + 0.08));
              tl.to("#s3-cursor", { scale: 0.82, duration: 0.08, ease: "power1.out" }, g(at));
              tl.to("#s3-cursor", { scale: 1, duration: 0.2, ease: "power2.out" }, g(at + 0.08));
              tl.fromTo("#s3-ripple", { x, y, scale: 0.2, opacity: 0.9 }, { x, y, scale: 1.4, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, g(at));
            };
            click(6.48, "#s3-cta", 124, 392);

            /* ---------- the button becomes the modal ---------- */
            gsap.set("#s3-modal", { transformOrigin: "-146px 336px" }); // the CTA, in modal space
            tl.fromTo("#s3-dim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, g(6.56));
            tl.fromTo("#s3-page", { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.5, ease: "power2.out" }, g(6.56));
            tl.fromTo("#s3-modal", { opacity: 0, scale: 0.4, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: OUT }, g(6.56));
            const amt = { v: 0 };
            tl.fromTo(amt, { v: 0 }, { v: 15000, duration: 0.6, ease: "power3.out", onUpdate: () => ($("#s3-amt").textContent = K.peso(amt.v)) }, g(6.82));
            tl.fromTo("#s3-laya", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: OUT }, g(7.12));
            tl.fromTo("#s3-laya-sh", { xPercent: -120 }, { xPercent: 320, duration: 0.7, ease: "power2.inOut" }, g(7.2));

            /* ---------- send: press, morph to a spinner, land ---------- */
            click(7.5, "#s3-send", 436, 425);
            tl.to("#s3-send-a", { opacity: 0, y: -14, duration: 0.18, ease: "power2.in" }, g(7.54));
            tl.fromTo("#s3-send-bg", { clipPath: "inset(0px 0px 0px 0px round 16px)" }, { clipPath: "inset(0px 130px 0px 130px round 26px)", duration: 0.26, ease: "power3.inOut" }, g(7.54));
            tl.fromTo("#s3-spin", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 300, duration: 0.3, ease: "none" }, g(7.6));
            tl.to("#s3-spin", { opacity: 0, rotation: 420, duration: 0.12, ease: "none" }, g(7.9));
            tl.to("#s3-send-bg", { clipPath: "inset(0px 0px 0px 0px round 16px)", backgroundColor: "#a7e8d1", duration: 0.34, ease: OUT }, g(7.82));
            tl.fromTo("#s3-send-b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: OUT }, g(7.86));
            tl.fromTo("#s3-chk", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, g(7.92));

            /* ---------- tilt down to the back office ---------- */
            tl.set("#s3-whip-b", { attr: { stdDeviation: "0 0" } }, g(8.12));
            tl.set("#s3-inner", { filter: "url(#s3-whip)" }, g(8.14));
            tl.to("#s3-whip-b", { attr: { stdDeviation: "0 34" }, duration: 0.3, ease: "power2.in" }, g(8.14));
            tl.to("#s3-inner", { y: -760, duration: 0.42, ease: "power3.in" }, g(8.14));
            tl.to("#s3-inner", { opacity: 0, duration: 0.14, ease: "power1.in" }, g(8.42));

            window.__timelines["s3"] = tl;
          }

          K.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
