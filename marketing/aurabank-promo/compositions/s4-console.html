      <script>
        (function () {
          const K = window.AuraKit;
          const S = 8.15;
          const g = K.at(S);
          const tl = gsap.timeline({ paused: true });
          const OUT = "expo.out";
          const fadeUp = (sel, at, y = 22, dur = 0.7) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: OUT }, g(at));
          const count = (el, to, at, dur, fmt) => {
            const o = { v: 0 };
            tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(o.v)) }, g(at));
          };

          function build() {
            /* ---------- the tilt down lands here: the console rises with the camera ---------- */
            tl.set("#s4-rig", { filter: "url(#s4-tilt)" }, 0);
            tl.fromTo("#s4-tilt-b", { attr: { stdDeviation: "0 34" } }, { attr: { stdDeviation: "0 0" }, duration: 0.45, ease: "power2.out" }, g(8.3));
            tl.set("#s4-rig", { filter: "none" }, g(8.78));
            tl.fromTo("#s4-rig", { y: 760, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: OUT }, g(8.28));
            tl.fromTo("#s4-console", { rotationX: 26 }, { rotationX: 0, duration: 1.3, ease: OUT }, g(8.28));
            tl.fromTo("#s4-cam", { scale: 1 }, { scale: 1.035, duration: 2.6, ease: "sine.inOut" }, g(8.9));

            /* ---------- copy on the VO: "Every move" 8.45, "screened by AI" 9.06, "signed off" 10.15 ---------- */
            tl.fromTo("#s4-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, g(8.42));
            tl.fromTo("#s4-eb-t", { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" }, g(8.46));
            [9.06, 9.4, 9.56].forEach((at, i) => {
              tl.fromTo(gsap.utils.toArray(".s4-w")[i], { yPercent: 112, rotationX: -60, filter: "blur(6px)" }, { yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.8, ease: OUT }, g(at));
            });
            tl.set(".s4-w", { filter: "none" }, g(10.5));
            tl.fromTo("#s4-l2", { yPercent: 112 }, { yPercent: 0, duration: 0.9, ease: OUT }, g(10.15));
            tl.fromTo("#s4-l2", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 1.1, ease: "power2.inOut", immediateRender: false }, g(10.6));

            /* ---------- the overview fills in ---------- */
            fadeUp("#s4-hero", 8.8, 18);
            gsap.utils.toArray(".s4-stat").forEach((el, i) => {
              fadeUp(el, 8.9 + i * 0.07, 26);
              const n = el.querySelector(".s4-num");
              count(n, Number(n.dataset.to), 8.95 + i * 0.07, 1.1, (v) => String(Math.round(v)));
            });
            gsap.utils.toArray(".s4-row").forEach((el, i) => tl.fromTo(el, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: OUT }, g(9.15 + i * 0.06)));

            /* ---------- Laya scans the queue, then flags the hold ---------- */
            tl.fromTo("#s4-scan", { opacity: 0, y: -90 }, { opacity: 1, y: 300, duration: 0.55, ease: "power1.inOut" }, g(9.5));
            tl.to("#s4-scan", { opacity: 0, duration: 0.2, ease: "power1.in" }, g(9.9));
            tl.fromTo("#s4-hl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, g(9.84));
