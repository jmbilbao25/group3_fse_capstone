        .s5-tag { position: absolute; left: 0; right: 0; top: 414px; display: flex; justify-content: center; gap: .26em; font-size: 60px; font-weight: 500; letter-spacing: -.03em; white-space: nowrap; }

        .s5-mini .s5-sheen { position: absolute; top: -40%; left: 0; width: 45%; height: 180%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .18), rgba(255, 255, 255, 0)); }

                <i style="left:170px;top:90px;width:260px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(167,232,209,.45),rgba(167,232,209,0))"></i>
                <i style="left:22px;top:66px;width:118px;height:15px;border-radius:4px;background:#fff"></i>

                <i style="left:22px;top:148px;width:74px;height:20px;border-radius:10px;background:#a7e8d1"></i>

                <i style="left:12px;top:114px;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #e2e5e8"></i>
                <i style="left:41px;top:114px;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #e2e5e8"></i>

        </div>
      </div>

      <script>
        (function () {
          const K = window.AuraKit;
          const S = 11.9;
          const g = K.at(S);
          const tl = gsap.timeline({ paused: true });
          const OUT = "expo.out";

          function build() {
            /* ---------- out of the flash: the world settles back ---------- */
            tl.fromTo("#s5-cam", { opacity: 0, scale: 1.16, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: OUT }, g(11.98));
            tl.set("#s5-cam", { filter: "none" }, g(13.0));
            tl.to("#s5-cam", { scale: 1.04, duration: 2.0, ease: "sine.inOut" }, g(13.0));

            /* ---------- the badge turns into place: a real tile with depth ---------- */
            tl.fromTo("#s5-badge", { rotationY: 64, rotationX: -14, scale: 0.6 }, { rotationY: 0, rotationX: 0, scale: 1, duration: 1.1, ease: OUT }, g(12.0));
            tl.to("#s5-badge", { rotationY: -10, rotationX: 4, duration: 1.9, ease: "sine.inOut" }, g(13.1));
            tl.fromTo("#s5-glint", { xPercent: -190 }, { xPercent: 290, duration: 0.8, ease: "power2.inOut" }, g(12.45));

            /* ---------- "Aura." (12.23) ---------- */
            tl.fromTo("#s5-word", { x: -60, clipPath: "inset(-20% 100% -20% 0%)" }, { x: 0, clipPath: "inset(-20% -6% -20% 0%)", duration: 0.85, ease: "power3.out" }, g(12.1));
            gsap.utils.toArray("#s5-word span").forEach((el, i) => {
              tl.fromTo(el, { opacity: 0, yPercent: 38, rotationX: -64, filter: "blur(7px)" }, { opacity: 1, yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.7, ease: OUT }, g(12.16 + i * 0.07));
            });
            tl.set("#s5-word span", { filter: "none" }, g(13.0));

            /* ---------- "Banking," (12.95) "in a new light." (13.58), then the light passes through it ---------- */
            tl.fromTo("#s5-t1", { yPercent: 112, rotationX: -60 }, { yPercent: 0, rotationX: 0, duration: 0.85, ease: OUT }, g(12.92));
            tl.fromTo("#s5-t2", { yPercent: 112 }, { yPercent: 0, duration: 0.9, ease: OUT }, g(13.52));
            tl.fromTo("#s5-t2", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: 1.2, ease: "power2.inOut", immediateRender: false }, g(13.85));

            /* ---------- one bank, three surfaces ---------- */
            [["#s5-d1", 20], ["#s5-d2", 0], ["#s5-d3", -20]].forEach(([s, ry], i) => {
              tl.fromTo(s, { opacity: 0, y: 110, rotationY: ry, rotationX: 18 }, { opacity: 1, y: 0, rotationY: ry * 0.4, rotationX: 0, duration: 1.1, ease: OUT }, g(13.0 + i * 0.1));
              tl.to(s, { y: -6 + i * 3, duration: 1.4, ease: "sine.inOut" }, g(14.1 + i * 0.1));
            });
            gsap.utils.toArray(".s5-sheen").forEach((el, i) => tl.fromTo(el, { xPercent: -150 }, { xPercent: 330, duration: 0.9, ease: "power2.inOut" }, g(13.5 + i * 0.12)));

            window.__timelines["s5"] = tl;
          }

          K.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
