      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080b; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: "Onest", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
      }
      .clip { position: absolute; inset: 0; }

      /* Paint order. Track indices are Studio lanes only; z-index decides depth. */
      #world { z-index: 0; }
      #s1 { z-index: 10; }
      #s2 { z-index: 20; }
      #s3 { z-index: 30; }
      #s4 { z-index: 40; }
      #s5 { z-index: 50; }
      #card3d { z-index: 60; }
      #fx { z-index: 70; }
      #finish { z-index: 80; }

      /* Shared type, used by every scene. */
      .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-size: 22px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #a7e8d1;
      }
      .eyebrow i { display: block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: #a7e8d1; box-shadow: 0 0 14px 2px rgba(167, 232, 209, .7); }
      .eyebrow b { display: inline-block; font-weight: 600; }
      .headline { font-size: 100px; font-weight: 600; line-height: 1.02; letter-spacing: -.04em; white-space: nowrap; }
      .ln { display: block; overflow: hidden; padding: .04em .08em .14em 0; margin: -.04em 0 -.1em; perspective: 640px; }
      .ln .w { display: inline-block; transform-origin: 50% 100%; }
      .grad {
        background: linear-gradient(100deg, #97cff3 0%, #a7e8d1 38%, #f2fffa 50%, #a7e8d1 62%, #97cff3 100%);
        background-size: 260% 100%; background-position: 100% 50%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .pills { display: flex; gap: 14px; margin-top: 46px; }
      .pill {
        display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 16px; white-space: nowrap;
        border-radius: 999px; background: rgba(16, 23, 28, .55); border: 1px solid rgba(255, 255, 255, .18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
        font-size: 19px; font-weight: 500; color: #fff;
      }
      .pill svg { width: 22px; height: 22px; color: #a7e8d1; flex: none; }
      .avatar {
        width: 44px; height: 44px; border-radius: 50%; background: #a7e8d1; color: #10171c; flex: none;
        display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px;
      }
    </style>
